<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinFlow — FX Rate Monitor</title>

  <!--
    Chart.js — used for sparkline charts on each currency card.
    Loaded from CDN, no install required.
  -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!--
    JetBrains Mono — monospace font that gives authentic terminal character
    to rate digits without looking like a generic code editor.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Design tokens ─────────────────────────────────────────────────────── */
    :root {
      --bg:           #090c0f;
      --surface:      #0e1318;
      --surface-2:    #141c23;
      --border:       #1e2c38;
      --border-bright:#2a3f52;
      --text:         #c8d8e4;
      --text-dim:     #4a6070;
      --text-muted:   #2a3f52;
      --green:        #00ff88;
      --green-dim:    #00ff8822;
      --green-mid:    #00c864;
      --red:          #ff3d5a;
      --red-dim:      #ff3d5a22;
      --amber:        #ffaa00;
      --cyan:         #00d4ff;
      --font-mono:    'JetBrains Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    /* ── Reset & base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      min-height: 100vh;
      /* Subtle scanline texture using a repeating gradient */
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 136, 0.012) 2px,
        rgba(0, 255, 136, 0.012) 4px
      );
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Terminal prompt prefix */
    .prompt {
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -0.02em;
    }

    .logo-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-left: 4px;
    }

    /* Blinking cursor after logo */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--green);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-stat {
      text-align: right;
    }

    .header-stat-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-stat-value {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border-bright);
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 14px;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .refresh-btn:hover {
      background: var(--green-dim);
      border-color: var(--green);
    }

    .refresh-btn.spinning {
      opacity: 0.5;
      pointer-events: none;
    }

    /* ── Main layout ────────────────────────────────────────────────────────── */
    .main {
      display: grid;
      /* Cards take remaining space; right panel is fixed width */
      grid-template-columns: 1fr 300px;
      gap: 0;
      height: calc(100vh - 53px - 36px); /* full height minus header and status bar */
    }

    /* ── Pair grid ──────────────────────────────────────────────────────────── */
    .pairs-section {
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    .section-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .pairs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    /* ── Currency card ──────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
      position: relative;
      overflow: hidden;
      /* Cards animate in on load */
      opacity: 0;
      transform: translateY(8px);
      animation: cardIn 0.3s ease forwards;
    }

    /* Stagger card entrance animations */
    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.10s; }
    .card:nth-child(3) { animation-delay: 0.15s; }
    .card:nth-child(4) { animation-delay: 0.20s; }
    .card:nth-child(5) { animation-delay: 0.25s; }
    .card:nth-child(6) { animation-delay: 0.30s; }
    .card:nth-child(7) { animation-delay: 0.35s; }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      border-color: var(--border-bright);
      background: var(--surface-2);
    }

    .card.selected {
      border-color: var(--green);
      background: var(--surface-2);
    }

    /* Flash green when rate goes up */
    .card.flash-up {
      animation: flashUp 0.8s ease;
    }

    @keyframes flashUp {
      0%   { background: var(--green-dim); }
      100% { background: var(--surface); }
    }

    /* Flash red when rate goes down */
    .card.flash-down {
      animation: flashDown 0.8s ease;
    }

    @keyframes flashDown {
      0%   { background: var(--red-dim); }
      100% { background: var(--surface); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .pair-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .alert-badge {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 7px;
      border: 1px solid;
    }

    .alert-badge.armed {
      color: var(--amber);
      border-color: var(--amber);
      background: rgba(255, 170, 0, 0.08);
    }

    .alert-badge.none {
      color: var(--text-muted);
      border-color: var(--border);
    }

    .rate-display {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      /* Monospace so digits don't shift width when rate updates */
      font-variant-numeric: tabular-nums;
    }

    .rate-display.null-rate {
      color: var(--text-muted);
      font-size: 18px;
    }

    .change-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .change-arrow {
      font-size: 11px;
    }

    .change-pct {
      font-size: 11px;
      font-weight: 500;
    }

    .change-pct.up   { color: var(--green); }
    .change-pct.down { color: var(--red); }
    .change-pct.flat { color: var(--text-dim); }

    /* Sparkline canvas container */
    .sparkline-wrap {
      height: 40px;
      position: relative;
    }

    .sparkline-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Right panel ────────────────────────────────────────────────────────── */
    .panel {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow-y: auto;
    }

    .panel-section {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* Alert form */
    .form-row {
      margin-bottom: 10px;
    }

    .form-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: block;
    }

    .form-select,
    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-select:focus,
    .form-input:focus {
      border-color: var(--green);
    }

    /* Above / Below toggle buttons */
    .toggle-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .toggle-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .toggle-btn.active-above {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-dim);
    }

    .toggle-btn.active-below {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-dim);
    }

    .arm-btn {
      width: 100%;
      background: var(--green-dim);
      border: 1px solid var(--green);
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .arm-btn:hover {
      background: var(--green);
      color: var(--bg);
    }

    .form-msg {
      font-size: 10px;
      margin-top: 8px;
      min-height: 14px;
    }

    .form-msg.success { color: var(--green); }
    .form-msg.error   { color: var(--red); }

    /* Active alerts list */
    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .alert-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .alert-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .alert-item-pair {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .alert-item-detail {
      font-size: 10px;
      color: var(--text-dim);
    }

    .alert-item-detail.above { color: var(--green-mid); }
    .alert-item-detail.below { color: var(--red); }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 2px;
      transition: color 0.15s ease;
    }

    .delete-btn:hover { color: var(--red); }

    .no-alerts {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      padding: 16px 0;
    }

    /* ── Status bar ─────────────────────────────────────────────────────────── */
    .statusbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 24px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      z-index: 100;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .status-dot.connected    { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.disconnected { background: var(--red); }

    .status-item { display: flex; align-items: center; }

    .status-countdown {
      margin-left: auto;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────────────────────────── -->
<header class="header">
  <div class="header-left">
    <span class="prompt">~/fx $</span>
    <div>
      <span class="logo">finflow</span>
      <span class="cursor"></span>
      <span class="logo-tag">fx rate monitor · sterling desk</span>
    </div>
  </div>
  <div class="header-right">
    <div class="header-stat">
      <div class="header-stat-label">Pairs Tracked</div>
      <div class="header-stat-value" id="stat-pairs">7</div>
    </div>
    <div class="header-stat">
      <div class="header-stat-label">Last Update</div>
      <div class="header-stat-value" id="stat-updated">--:--</div>
    </div>
    <button class="refresh-btn" id="refresh-btn" onclick="refreshAll()">⟳ Refresh</button>
  </div>
</header>

<!-- ── Main layout ───────────────────────────────────────────────────────────── -->
<div class="main">

  <!-- Left: currency pair cards -->
  <div class="pairs-section">
    <div class="section-label">Currency Pairs</div>
    <div class="pairs-grid" id="pairs-grid">
      <!-- Cards injected by JavaScript -->
    </div>
  </div>

  <!-- Right: alert panel -->
  <div class="panel">

    <!-- Alert creation form -->
    <div class="panel-section">
      <div class="panel-title">▲ Arm New Alert</div>

      <div class="form-row">
        <label class="form-label">Currency Pair</label>
        <select class="form-select" id="alert-pair">
          <option value="GBP/USD">GBP/USD</option>
          <option value="GBP/EUR">GBP/EUR</option>
          <option value="GBP/JPY">GBP/JPY</option>
          <option value="GBP/CHF">GBP/CHF</option>
          <option value="GBP/CAD">GBP/CAD</option>
          <option value="GBP/AUD">GBP/AUD</option>
          <option value="GBP/CNY">GBP/CNY</option>
        </select>
      </div>

      <div class="form-row">
        <label class="form-label">Direction</label>
        <div class="toggle-row">
          <button class="toggle-btn active-above" id="btn-above" onclick="setDirection('above')">▲ Above</button>
          <button class="toggle-btn" id="btn-below" onclick="setDirection('below')">▼ Below</button>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">Target Rate</label>
        <input class="form-input" id="alert-rate" type="number" step="0.0001" placeholder="0.0000" />
      </div>

      <button class="arm-btn" onclick="createAlert()">Arm Alert</button>
      <div class="form-msg" id="form-msg"></div>
    </div>

    <!-- Active alerts list -->
    <div class="panel-section" style="flex: 1;">
      <div class="panel-title">Active Alerts <span id="alert-count-label"></span></div>
      <div class="alert-list" id="alert-list">
        <div class="no-alerts">No alerts armed</div>
      </div>
    </div>

  </div>
</div>

<!-- ── Status bar ────────────────────────────────────────────────────────────── -->
<div class="statusbar">
  <div class="status-item">
    <span class="status-dot" id="db-dot"></span>
    <span id="db-label">connecting...</span>
  </div>
  <div class="status-item" id="status-db-path"></div>
  <div class="status-item" id="status-alerts-count"></div>
  <div class="status-countdown" id="status-countdown"></div>
</div>

<script>
  /*
   * dashboard.js (inline)
   *
   * Responsibilities:
   *   - Fetch rates, history, alerts and status from the Flask API
   *   - Render and update currency pair cards with sparklines
   *   - Handle alert creation and deletion
   *   - Poll /api/rates every 30 seconds automatically
   *   - Flash cards green/red when rates change
   *
   * API base URL — change this if you run Flask on a different port.
   */
  const API = 'http://localhost:5001';

  // How often (ms) to auto-refresh rates
  const REFRESH_INTERVAL = 30_000;

  // How often (ms) to refresh sparkline history (less frequent — data changes slowly)
  const HISTORY_INTERVAL = 5 * 60_000;

  // Stores the previous rate per pair so we can detect changes for flash effect
  const previousRates = {};

  // Stores Chart.js instances keyed by pair — needed to update without recreating
  const sparklineCharts = {};

  // Alert direction selected in the form
  let alertDirection = 'above';

  // Countdown timer state
  let secondsUntilRefresh = 30;
  let countdownTimer = null;

  // ── Utilities ──────────────────────────────────────────────────────────────

  /**
   * Format a rate number to a consistent decimal places.
   * JPY pairs use 2dp; everything else uses 4dp.
   */
  function formatRate(pair, rate) {
    if (rate === null || rate === undefined) return '—';
    const dp = pair.includes('JPY') ? 2 : 4;
    return rate.toFixed(dp);
  }

  /**
   * Return a time string in HH:MM:SS format from an ISO timestamp string.
   */
  function formatTime(isoString) {
    if (!isoString) return '--:--';
    const d = new Date(isoString.replace(' ', 'T'));
    return d.toTimeString().slice(0, 8);
  }

  /**
   * Show a temporary message in the alert form feedback area.
   */
  function showFormMsg(text, type) {
    const el = document.getElementById('form-msg');
    el.textContent = text;
    el.className = `form-msg ${type}`;
    setTimeout(() => { el.textContent = ''; el.className = 'form-msg'; }, 3000);
  }

  // ── Card rendering ─────────────────────────────────────────────────────────

  /**
   * Build the initial set of currency pair cards from the /api/rates response.
   * Called once on page load; subsequent updates use updateCard().
   */
  function buildCards(rates) {
    const grid = document.getElementById('pairs-grid');
    grid.innerHTML = '';

    rates.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${item.pair.replace('/', '-')}`;
      card.onclick = () => selectCard(item.pair);
      card.innerHTML = cardHTML(item);
      grid.appendChild(card);
    });
  }

  /**
   * Generate the inner HTML for a single currency card.
   */
  function cardHTML(item) {
    const rateStr   = formatRate(item.pair, item.rate);
    const changeStr = item.change_pct !== null
      ? `${item.change_pct > 0 ? '+' : ''}${item.change_pct.toFixed(2)}%`
      : '—';
    const changeClass = item.change_pct === null ? 'flat'
  : item.change_pct > 0 ? 'up'
  : item.change_pct < 0 ? 'down' : 'flat';
    const arrow = item.change_pct === null ? '' : item.change_pct > 0 ? '▲' : '▼';

    return `
      <div class="card-header">
        <div class="pair-name">${item.pair}</div>
        <div class="alert-badge none" id="badge-${item.pair.replace('/', '-')}">no alert</div>
      </div>
      <div class="rate-display${item.rate === null ? ' null-rate' : ''}" id="rate-${item.pair.replace('/', '-')}">
        ${rateStr}
      </div>
      <div class="change-row">
        <span class="change-arrow ${changeClass}">${arrow}</span>
        <span class="change-pct ${changeClass}" id="change-${item.pair.replace('/', '-')}">${changeStr}</span>
      </div>
      <div class="sparkline-wrap">
        <canvas id="spark-${item.pair.replace('/', '-')}"></canvas>
      </div>
    `;
  }

  /**
   * Update an existing card's rate and change indicator without rebuilding it.
   * Also triggers a flash animation if the rate has changed since last update.
   */
  function updateCard(item) {
    const id      = item.pair.replace('/', '-');
    const rateEl  = document.getElementById(`rate-${id}`);
    const changeEl = document.getElementById(`change-${id}`);
    const card    = document.getElementById(`card-${id}`);

    if (!rateEl || !card) return;

    const rateStr    = formatRate(item.pair, item.rate);
    const changeStr  = item.change_pct !== null
      ? `${item.change_pct > 0 ? '+' : ''}${item.change_pct.toFixed(2)}%`
      : '—';
    const changeClass = item.change_pct === null ? 'flat'
  : item.change_pct > 0 ? 'up'
  : item.change_pct < 0 ? 'down' : 'flat';

    // Flash the card if the rate changed since last poll
    const prev = previousRates[item.pair];
    if (prev !== undefined && item.rate !== null && item.rate !== prev) {
      card.classList.remove('flash-up', 'flash-down', 'selected');
      void card.offsetWidth; // force reflow so animation restarts
      card.classList.add(item.rate > prev ? 'flash-up' : 'flash-down');
    }

    previousRates[item.pair] = item.rate;

    rateEl.textContent = rateStr;
    rateEl.className   = `rate-display${item.rate === null ? ' null-rate' : ''}`;

    if (changeEl) {
      changeEl.textContent = changeStr;
      changeEl.className   = `change-pct ${changeClass}`;
    }
  }

  // ── Sparklines ─────────────────────────────────────────────────────────────

  /**
   * Fetch history for a single pair and draw or update its sparkline.
   * Chart.js Line chart with no axes, no labels — purely visual.
   */
  async function drawSparkline(pair) {
    const id = pair.replace('/', '-');
    const canvas = document.getElementById(`spark-${id}`);
    if (!canvas) return;

    try {
      const res  = await fetch(`${API}/api/history/${pair}`);
      const data = await res.json();

      if (!data || data.length < 2) return;

      const labels = data.map(d => d.timestamp);
      const values = data.map(d => d.rate);

      // Determine line colour from trend
      const trend = values[values.length - 1] >= values[0];
      const lineColor = trend ? '#00ff88' : '#ff3d5a';
      const fillColor = trend ? 'rgba(0,255,136,0.06)' : 'rgba(255,61,90,0.06)';

      const chartData = {
        labels,
        datasets: [{
          data: values,
          borderColor: lineColor,
          backgroundColor: fillColor,
          borderWidth: 1.5,
          pointRadius: 0,
          fill: true,
          tension: 0.3,
        }],
      };

      // If chart already exists, update its data; otherwise create it
      if (sparklineCharts[pair]) {
        sparklineCharts[pair].data = chartData;
        sparklineCharts[pair].update('none'); // 'none' = skip animation on update
      } else {
        sparklineCharts[pair] = new Chart(canvas, {
          type: 'line',
          data: chartData,
          options: {
            responsive: false,
            maintainAspectRatio: false,
            animation: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: {
              x: { display: false },
              y: { display: false },
            },
          },
        });
      }
    } catch (e) {
      // Sparkline failure is non-fatal — the card still shows the rate
      console.warn(`Sparkline fetch failed for ${pair}:`, e);
    }
  }

  /**
   * Draw sparklines for all 7 pairs. Called on load and every 5 minutes.
   */
  async function drawAllSparklines() {
    const pairs = ['GBP/USD','GBP/EUR','GBP/JPY','GBP/CHF','GBP/CAD','GBP/AUD','GBP/CNY'];
    for (const pair of pairs) {
      await drawSparkline(pair);
    }
  }

  // ── Rates fetch ────────────────────────────────────────────────────────────

  /**
   * Fetch current rates from the API and update all cards.
   * Also updates the header timestamp.
   */
  async function fetchRates() {
    try {
      const res   = await fetch(`${API}/api/rates`);
      const rates = await res.json();

      const cardsExist = document.querySelector('.card');

      if (!cardsExist) {
        // First load — build cards from scratch
        buildCards(rates);
        await drawAllSparklines();
      } else {
        // Subsequent polls — update existing cards
        rates.forEach(item => updateCard(item));
      }

      // Update header timestamp from the most recent rate
      const latest = rates.find(r => r.timestamp);
      if (latest) {
        document.getElementById('stat-updated').textContent = formatTime(latest.timestamp);
      }

      // Store current rates as previous for next comparison
      rates.forEach(r => {
        if (previousRates[r.pair] === undefined) {
          previousRates[r.pair] = r.rate;
        }
      });

    } catch (e) {
      console.error('Rate fetch failed:', e);
    }
  }

  // ── Status bar ─────────────────────────────────────────────────────────────

  /**
   * Fetch /api/status and update the status bar at the bottom of the page.
   */
  async function fetchStatus() {
    try {
      const res    = await fetch(`${API}/api/status`);
      const status = await res.json();

      const dot   = document.getElementById('db-dot');
      const label = document.getElementById('db-label');

      if (status.db_connected) {
        dot.className   = 'status-dot connected';
        label.textContent = 'db connected';
      } else {
        dot.className   = 'status-dot disconnected';
        label.textContent = 'db error';
      }

      document.getElementById('status-db-path').textContent =
        status.db_path ? status.db_path.split('/').pop() : '';

      document.getElementById('status-alerts-count').textContent =
        `alerts: ${status.alert_count} armed`;

    } catch (e) {
      document.getElementById('db-dot').className = 'status-dot disconnected';
      document.getElementById('db-label').textContent = 'api unreachable';
    }
  }

  // ── Alerts ─────────────────────────────────────────────────────────────────

  /**
   * Fetch active alerts and render them in the right panel list.
   * Also updates the alert badge on each currency card.
   */
  async function fetchAlerts() {
    try {
      const res    = await fetch(`${API}/api/alerts`);
      const alerts = await res.json();

      renderAlertList(alerts);
      updateAlertBadges(alerts);

      const label = document.getElementById('alert-count-label');
      label.textContent = alerts.length > 0 ? `[${alerts.length}]` : '';

    } catch (e) {
      console.error('Alert fetch failed:', e);
    }
  }

  /**
   * Render the list of active alerts in the right panel.
   */
  function renderAlertList(alerts) {
    const list = document.getElementById('alert-list');

    if (alerts.length === 0) {
      list.innerHTML = '<div class="no-alerts">No alerts armed</div>';
      return;
    }

    list.innerHTML = alerts.map(a => {
      const details = [];
      if (a.threshold_high !== null) {
        details.push(`<div class="alert-item-detail above">▲ rises above ${formatRate(a.pair, a.threshold_high)}</div>`);
      }
      if (a.threshold_low !== null) {
        details.push(`<div class="alert-item-detail below">▼ falls below ${formatRate(a.pair, a.threshold_low)}</div>`);
      }
      return `
        <div class="alert-item" id="alert-item-${a.id}">
          <div class="alert-item-info">
            <div class="alert-item-pair">${a.pair}</div>
            ${details.join('')}
          </div>
          <button class="delete-btn" onclick="deleteAlert(${a.id})" title="Remove alert">×</button>
        </div>
      `;
    }).join('');
  }

  /**
   * Update the alert badge on each card based on current alert list.
   */
  function updateAlertBadges(alerts) {
    // Clear all badges first
    document.querySelectorAll('.alert-badge').forEach(b => {
      b.textContent = 'no alert';
      b.className = 'alert-badge none';
    });

    // Set armed badge for pairs that have an alert
    alerts.forEach(a => {
      const id    = a.pair.replace('/', '-');
      const badge = document.getElementById(`badge-${id}`);
      if (badge) {
        badge.textContent = '1 armed';
        badge.className   = 'alert-badge armed';
      }
    });
  }

  /**
   * Handle the ARM ALERT button click.
   * Reads the form, posts to /api/alerts, refreshes the alert list.
   */
  async function createAlert() {
    const pair      = document.getElementById('alert-pair').value;
    const rateInput = parseFloat(document.getElementById('alert-rate').value);

    if (isNaN(rateInput) || rateInput <= 0) {
      showFormMsg('Enter a valid target rate', 'error');
      return;
    }

    // Map form direction to the correct threshold field
    const body = { pair };
    if (alertDirection === 'above') {
      body.threshold_high = rateInput;
    } else {
      body.threshold_low = rateInput;
    }

    try {
      const res = await fetch(`${API}/api/alerts`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body),
      });

      if (res.ok) {
        showFormMsg('Alert armed', 'success');
        document.getElementById('alert-rate').value = '';
        await fetchAlerts();
        await fetchStatus();
      } else {
        const err = await res.json();
        showFormMsg(err.error || 'Failed to create alert', 'error');
      }
    } catch (e) {
      showFormMsg('API unreachable', 'error');
    }
  }

  /**
   * Delete an alert by ID and refresh the list.
   */
  async function deleteAlert(id) {
    try {
      await fetch(`${API}/api/alerts/${id}`, { method: 'DELETE' });
      await fetchAlerts();
      await fetchStatus();
    } catch (e) {
      console.error('Delete failed:', e);
    }
  }

  // ── Card interaction ───────────────────────────────────────────────────────

  /**
   * When a currency card is clicked, pre-fill the alert form with that pair.
   */
  function selectCard(pair) {
    // Highlight selected card
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    const card = document.getElementById(`card-${pair.replace('/', '-')}`);
    if (card) card.classList.add('selected');

    // Pre-fill pair selector
    document.getElementById('alert-pair').value = pair;
  }

  // ── Alert form direction toggle ────────────────────────────────────────────

  /**
   * Switch the alert direction between 'above' and 'below'.
   */
  function setDirection(dir) {
    alertDirection = dir;
    const btnAbove = document.getElementById('btn-above');
    const btnBelow = document.getElementById('btn-below');
    btnAbove.className = `toggle-btn ${dir === 'above' ? 'active-above' : ''}`;
    btnBelow.className = `toggle-btn ${dir === 'below' ? 'active-below' : ''}`;
  }

  // ── Countdown timer ────────────────────────────────────────────────────────

  /**
   * Start a countdown in the status bar showing seconds until next auto-refresh.
   */
  function startCountdown() {
    secondsUntilRefresh = REFRESH_INTERVAL / 1000;

    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      secondsUntilRefresh--;
      document.getElementById('status-countdown').textContent =
        `next refresh in ${secondsUntilRefresh}s`;

      if (secondsUntilRefresh <= 0) {
        clearInterval(countdownTimer);
      }
    }, 1000);
  }

  // ── Manual refresh ─────────────────────────────────────────────────────────

  /**
   * Manual refresh triggered by the header button.
   */
  async function refreshAll() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    btn.textContent = '⟳ Refreshing...';

    await fetchRates();
    await fetchAlerts();
    await fetchStatus();

    btn.classList.remove('spinning');
    btn.textContent = '⟳ Refresh';

    startCountdown();
  }

  // ── Auto-refresh loop ──────────────────────────────────────────────────────

  /**
   * Run an initial full load, then set up polling intervals.
   */
  async function init() {
    await fetchRates();
    await fetchAlerts();
    await fetchStatus();

    startCountdown();

    // Auto-refresh rates every 30 seconds
    setInterval(async () => {
      await fetchRates();
      await fetchAlerts();
      await fetchStatus();
      startCountdown();
    }, REFRESH_INTERVAL);

    // Refresh sparkline history every 5 minutes
    setInterval(drawAllSparklines, HISTORY_INTERVAL);
  }

  // Kick everything off when the page loads
  init();
</script>
</body>
</html>
